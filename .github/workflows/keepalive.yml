# 서버 깨우기: Supabase 무료 서버는 일주일 동안 아무도 쓰지 않으면 멈춘다 (사용자 요청 11/13).
# 심사 기간에 서버가 멈춰 있지 않도록 매일 한 번 긴급차량 목록을 읽는다. 공개 키로 읽기만 하고 아무것도 바꾸지 않는다.
# 서버가 이미 멈춰 있으면 이 작업이 실패(빨간 X)로 보인다. 그때는 Supabase 화면에서 서버를 다시 켠다(Restore).
name: 서버 깨우기

on:
  schedule:
    - cron: "23 0 * * *" # 매일 한국 시간 오전 9시 23분
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기 (서버 주소와 공개 키를 앱 코드에서 읽는다)
        uses: actions/checkout@v4

      - name: 서버에 긴급차량 목록 한 번 묻기
        run: |
          CONFIG=app/src/main/java/com/gilteojwo/receive/ServerConfig.kt
          URL=$(grep -oP 'const val URL = "\K[^"]+' "$CONFIG")
          KEY=$(grep -oP 'const val PUBLISHABLE_KEY = "\K[^"]+' "$CONFIG")
          curl -sS --fail-with-body --max-time 30 -o /dev/null -w "서버 응답 %{http_code}\n" \
            "$URL/rest/v1/positions_active?select=*&limit=1" \
            -H "apikey: $KEY"
