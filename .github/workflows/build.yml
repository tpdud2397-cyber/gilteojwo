# main에 올릴 때마다 폰용·차량용 APK를 만들어 Releases의 "개발 최신판"에 올린다.
# 제출본: Actions 화면에서 이 작업을 손으로 실행하며 제출본 이름(예: v1.0)을 넣거나, v로 시작하는 태그를 올리면
#         그 커밋의 APK를 "제출본" 릴리즈로 따로 고정해 둔다 (개발 최신판처럼 덮어쓰지 않는다).
# 파일 이름 뒤에 _R번호를 붙인다 (번호 = GitHub 빌드 번호, 앱 화면 맨 위의 R번호와 같다).
name: APK 빌드

on:
  push:
    branches: [main]
    # 제출본: v1.0 같은 태그를 올리면 빌드해서 따로 보관한다 (태그에는 아래 paths-ignore가 적용되지 않는다)
    tags: ["v*"]
    # 문서나 시험 도구(가짜 구급차)만 바꾼 경우에는 앱을 다시 만들지 않는다 (R번호가 쓸데없이 올라가지 않게)
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "tools/**"
  workflow_dispatch:
    inputs:
      submit_tag:
        description: "제출본 이름 (예: v1.0). 비워 두면 개발 최신판만 만든다"
        required: false
        default: ""

# 짧은 시간에 여러 번 올리면 마지막 것만 빌드한다
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Releases에 파일을 올리려면 필요

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Java 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      # 계산 시험(app/src/test)이 하나라도 실패하면 APK를 만들지 않는다
      - name: 계산 시험 + 폰용·차량용 APK 만들기
        run: ./gradlew testCarDebugUnitTest testPhoneDebugUnitTest assemblePhoneDebug assembleCarDebug --stacktrace

      - name: 파일 이름 정리 (뒤에 _R번호)
        run: |
          mkdir -p out
          cp app/build/outputs/apk/car/debug/app-car-debug.apk out/gilteojwo-car_R$GITHUB_RUN_NUMBER.apk
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk out/gilteojwo-phone_R$GITHUB_RUN_NUMBER.apk
          ls -l out

      - name: Releases의 "개발 최신판" 교체
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev out/*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "개발 최신판 R$GITHUB_RUN_NUMBER" \
            --notes "main에 올라온 최신 코드로 자동 빌드한 시험판입니다.
          - 차량용(에뮬레이터): gilteojwo-car_R$GITHUB_RUN_NUMBER.apk
          - 폰용: gilteojwo-phone_R$GITHUB_RUN_NUMBER.apk
          - 앱 화면 맨 위에 R$GITHUB_RUN_NUMBER 이 보이면 이 파일이 깔린 것입니다.
          - 커밋: $GITHUB_SHA"

      # 제출본: 이름(v1.0 등)으로 릴리즈를 만든다. 그 이름의 태그가 없으면 이 커밋에 새로 만든다.
      # 개발 최신판과 달리 다음 빌드가 덮어쓰지 않는다
      - name: Releases에 "제출본" 고정
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.submit_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.submit_tag }}
        run: |
          gh release create "$SUBMIT_TAG" out/*.apk \
            --target "$GITHUB_SHA" \
            --latest \
            --title "제출본 $SUBMIT_TAG (R$GITHUB_RUN_NUMBER)" \
            --notes "공모전 제출용으로 고정한 판입니다. 이 릴리즈의 파일은 바뀌지 않습니다.
          - 차량용(Pleos Connect 에뮬레이터): gilteojwo-car_R$GITHUB_RUN_NUMBER.apk
          - 폰용(긴급차량 송신, 선택): gilteojwo-phone_R$GITHUB_RUN_NUMBER.apk
          - 실행 방법: 저장소 README의 '실행 방법'
          - 커밋: $GITHUB_SHA"

      # 이 빌드의 R번호를 태그(R14 등)로 남긴다. 집 PC 빌드가 이 태그를 보고 '다음 R번호'를 알 수 있다
      - name: R번호 태그 남기기
        run: |
          git tag "R$GITHUB_RUN_NUMBER" "$GITHUB_SHA"
          git push origin "R$GITHUB_RUN_NUMBER"
